<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>THH Europe · Beheer</title>
<style>
@font-face{font-family:'Pilat';src:url('assets/fonts/Pilat-Regular.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Pilat';src:url('assets/fonts/Pilat-Book.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Pilat';src:url('assets/fonts/Pilat-Bold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Pilat';src:url('assets/fonts/Pilat-Black.woff') format('woff');font-weight:900;font-display:swap}
@font-face{font-family:'Pilat Extended';src:url('assets/fonts/PilatExtended-Bold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Pilat Extended';src:url('assets/fonts/PilatExtended-Black.woff') format('woff');font-weight:900;font-display:swap}
/* THH Europe — dark beheer (kleuren en typografie van thheurope.com) */
:root{--bg:#0F0F0F;--panel:#15191D;--panel2:#1B1B1B;--line:#2a2a2a;--line2:#343a40;--ink:rgba(255,255,255,.92);--text:rgba(255,255,255,.78);--muted:#8A8A8A;--muted2:#9A9A9A;--white:#fff;--black:#15191D;
--blue:#fff;--blue-soft:rgba(255,255,255,.08);
--ok:#3CCB9A;--ok-soft:rgba(18,134,102,.2);--green:#128666;--warn:#F2B544;--warn-soft:rgba(242,181,68,.13);--bad:#FF6B63;--bad-soft:rgba(225,6,0,.16);--red:#e10600}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'Pilat',Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--white)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
::selection{background:rgba(255,255,255,.2)}
/* logo zoals thheurope.com */
.tgl-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.tgl-badge{background:#fff;color:var(--black);font:900 11px/1 'Pilat Extended',Arial,sans-serif;letter-spacing:.06em;padding:5px 7px;border-radius:3px}
.tgl-word{display:flex;flex-direction:column;gap:3px}
.tgl-main{font:900 15px/1 'Pilat Extended',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:rgba(255,255,255,.78);white-space:nowrap}
.tgl-main .tgl-accent{color:#fff}
.tgl-sub{font:700 7px/1 'Pilat',Arial,sans-serif;text-transform:uppercase;letter-spacing:.32em;color:rgba(255,255,255,.55);white-space:nowrap}
/* layout */
.top{position:sticky;top:0;z-index:20;height:60px;background:var(--bg);border-bottom:1px solid var(--line);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px}
.top .sect{font:700 11px/1 'Pilat',Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding-left:16px;border-left:1px solid var(--line)}
.top .sp{flex:1}
.top .who{font-size:12px;color:var(--muted)}
.top button{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font:700 12px/1 'Pilat',Arial,sans-serif}
.top button:hover{border-color:#fff}
.env{background:var(--red);color:#fff;font:700 10px/1 'Pilat',Arial,sans-serif;padding:5px 8px;border-radius:3px;letter-spacing:.12em}
.wrap{display:flex;min-height:calc(100vh - 60px)}
nav.side{width:214px;flex:0 0 214px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:4px;text-decoration:none;color:rgba(255,255,255,.66);font:700 12px/1.2 'Pilat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
nav.side a:hover{background:var(--panel2);color:#fff}
nav.side a.on{background:var(--panel2);color:#fff;box-shadow:inset 2px 0 0 #fff}
nav.side .cnt{background:var(--red);color:#fff;border-radius:10px;font:700 10px/18px 'Pilat',Arial,sans-serif;letter-spacing:0;padding:0 7px;min-width:20px;text-align:center}
main{flex:1;min-width:0;padding:26px 30px 70px;max-width:1440px}
h1{font:900 24px/1.1 'Pilat Extended',Arial,sans-serif;text-transform:uppercase;letter-spacing:-.5px;margin:0 0 16px;color:#fff}
h2{font:900 13px/1.2 'Pilat Extended',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:26px 0 12px;color:#fff}
.eyebrow{font:700 11px/1 'Pilat',Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:1fr 1fr}
.g32{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
.tscroll{overflow-x:auto;border-radius:8px}
.tscroll table td,.tscroll table th{padding:9px 9px}
@media(max-width:1100px){.g32{grid-template-columns:1fr}}
@media(max-width:900px){.top{padding:0 12px;gap:10px}.top .who,.top .sect,.top .tgl-word{display:none}.wrap{flex-direction:column}nav.side{width:auto;flex:none;display:flex;gap:2px;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}nav.side a{white-space:nowrap;margin:0;gap:6px}nav.side a.on{box-shadow:inset 0 -2px 0 #fff}.g2{grid-template-columns:1fr}main{padding:16px 14px 60px}.kv{grid-template-columns:110px 1fr}table{display:block;overflow-x:auto}}
.stat .k{font:700 10.5px/1.3 'Pilat',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:900 22px/1.15 'Pilat Extended',Arial,sans-serif;margin-top:6px;color:#fff;letter-spacing:-.3px}
.stat .s{font-size:12px;color:var(--muted2);margin-top:6px}
.stat.alert .v{color:var(--bad)}
.stat.big .v{font-size:30px}
/* tabellen */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 10.5px/1.3 'Pilat',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel2);white-space:nowrap}
tfoot td{background:var(--panel2);color:#fff}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#1d2227}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
b,strong{color:#fff}
/* badges */
.b{display:inline-block;border-radius:3px;padding:2px 7px;font:700 10.5px/1.4 'Pilat',Arial,sans-serif;letter-spacing:.04em;white-space:nowrap;text-decoration:none}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}
.b.info{background:rgba(255,255,255,.08);color:#DADADA}
.b.grey{background:rgba(255,255,255,.05);color:var(--muted2)}
.b.test{background:var(--red);color:#fff}
/* illustratief: klein rood rondje */
.dd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:1px;box-shadow:0 0 0 2px rgba(225,6,0,.22);flex:none}
/* formulieren */
label.f{display:block;font:700 10.5px/1.3 'Pilat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400;font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=date],select,textarea{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;background:var(--bg);color:#fff;min-width:0}
input::placeholder,textarea::placeholder{color:#6f6f6f}
select option{background:var(--panel);color:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
input[type=checkbox]{accent-color:#fff}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #fff;background:#fff;color:var(--black);border-radius:4px;padding:8px 14px;font:700 12.5px/1.2 'Pilat',Arial,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.sec:hover{border-color:#fff;opacity:1}
.btn.blue{background:#fff;border-color:#fff;color:var(--black)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border-color:rgba(255,107,99,.45)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn[disabled]{opacity:.4;cursor:default}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line2);background:transparent;color:rgba(255,255,255,.75);border-radius:4px;padding:6px 12px;cursor:pointer;font:700 11px/1 'Pilat',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.tabs button:hover{border-color:#fff;color:#fff}
.tabs button.on{background:#fff;color:var(--black);border-color:#fff}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
@media(max-width:800px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chipf{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.08);color:#fff;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700}
.chipf button{border:0;background:none;color:inherit;cursor:pointer;font-weight:700;padding:0}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:5px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.note{border-left:3px solid var(--line2);padding:4px 10px;margin:6px 0;font-size:12px;color:var(--text)}
.note.c{border-color:#fff}
.msg{border-radius:4px;padding:10px 13px;margin:10px 0;font-size:13px;border:1px solid transparent}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:rgba(255,255,255,.06);color:var(--text);border-color:var(--line)}
/* login */
.login{max-width:400px;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:30px}
.login .tgl-logo{margin-bottom:22px}
.login h1{margin-bottom:6px;font-size:20px}
.login p{color:var(--muted);margin:0 0 20px}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:var(--black);padding:11px 18px;border-radius:4px;font:700 13px/1.3 'Pilat',Arial,sans-serif;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
/* prijzen */
td input.pr{width:88px;text-align:right;padding:4px 6px}
tr.dirty td{background:rgba(242,181,68,.08)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.back{display:inline-block;margin-bottom:12px;text-decoration:none;font:700 11px/1 'Pilat',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.back:hover{color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #444;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.share{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
pre.data{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0 0;max-height:220px;overflow:auto;color:var(--text)}
/* dashboard */
.dash-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{margin:0}
.dash-head .sp{flex:1}
.kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi-up{color:var(--ok)}.kpi-down{color:var(--bad)}
.chart-card{margin-top:14px;padding:18px 18px 10px}
.chart-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.chart-top h2{margin:0}
.legend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{font-family:'Pilat',Arial,sans-serif}
svg.chart .bar{fill:#fff}
svg.chart .bar.fut{fill:rgba(255,255,255,.14)}
svg.chart .ghost{fill:rgba(255,255,255,.13)}
svg.chart g.m:hover .bar{fill:#DADADA}
svg.chart g.m:hover .hov{fill:rgba(255,255,255,.04)}
.demo-tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--text);cursor:pointer;user-select:none}
.demo-tgl:hover{border-color:#fff}
.ops{margin-top:30px;padding-top:6px;border-top:1px solid var(--line)}
.yr-list{list-style:none;margin:0;padding:0}
.yr-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.yr-list li:last-child{border-bottom:0}
.bar-in{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:5px;overflow:hidden}
.bar-in span{display:block;height:100%;background:#fff}
/*@@CAMPCSS*/
.camp-grid{display:grid;grid-template-columns:minmax(360px,1fr) 680px;gap:16px;align-items:start}
.camp-grid>div{min-width:0}
.camp-form>.card{margin-bottom:12px}
.camp-form input,.camp-form select,.camp-form textarea{max-width:100%;box-sizing:border-box}
.camp-prev{position:sticky;top:12px}
.pv-wrap{background:#0F0F0F;border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:calc(100vh - 150px);display:flex;justify-content:center}
.pv-wrap iframe{border:0;height:2300px;background:#0F0F0F;transition:width .2s}
h3.ch{font:900 13px/1.2 'Pilat Extended','Pilat',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;color:#fff}
.psel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;background:#0F0F0F;border:1px solid var(--line);border-radius:6px;padding:8px}
.pitem img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
.pitem .pt{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.pitem .pt>div:nth-child(2){overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pitem .pb{display:flex;flex-direction:column;gap:3px}
.pitem .pb .btn{padding:2px 7px;font-size:11px}
.pres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;max-height:340px;overflow:auto}
.pres .pr{display:flex;gap:8px;align-items:center;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px;color:#fff;cursor:pointer;font:400 12px/1.3 'Pilat',Arial,sans-serif}
.pres .pr:hover{border-color:#fff}
.pres .pr[disabled]{opacity:.35;cursor:default}
.pres .pr img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
.pres .pr>span:nth-child(2){flex:1}
@media(max-width:1250px){.camp-grid{grid-template-columns:1fr}.camp-prev{position:static}}
@media(max-width:700px){.psel,.pres{grid-template-columns:1fr}.pv-wrap{justify-content:flex-start}.pv-wrap iframe{width:100%!important;min-width:360px}}
/*@@CAMPCSS_END*/
</style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN / WACHTWOORD -->
<section id="vLogin" class="hidden">
  <form class="login" id="fLogin" autocomplete="on">
    <span class="tgl-logo"><span class="tgl-badge">THHEU</span><span class="tgl-word"><span class="tgl-main">THH <span class="tgl-accent">EUROPE</span></span><span class="tgl-sub">Wholesale Supplements</span></span></span>
    <h1>Beheer</h1>
    <p>Log in met het beheeraccount.</p>
    <label class="f">E-mail<input type="email" name="email" required autocomplete="username" /></label>
    <label class="f">Wachtwoord<input type="password" name="password" required autocomplete="current-password" /></label>
    <label class="chk"><input type="checkbox" name="remember" /> Ingelogd blijven (30 dagen)</label>
    <div id="loginMsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn blue" type="submit">Inloggen</button><span class="sp"></span><a href="#" id="lnkForgot" class="small">Wachtwoord vergeten?</a></div>
  </form>
</section>
<section id="vSetpass" class="hidden">
  <form class="login" id="fSetpass">
    <span class="tgl-logo"><span class="tgl-badge">THHEU</span><span class="tgl-word"><span class="tgl-main">THH <span class="tgl-accent">EUROPE</span></span><span class="tgl-sub">Wholesale Supplements</span></span></span>
    <h1>Nieuw wachtwoord</h1>
    <p id="spEmail"></p>
    <label class="f">Nieuw wachtwoord (min. 10 tekens)<input type="password" name="password" minlength="10" required autocomplete="new-password" /></label>
    <label class="f">Herhaal<input type="password" name="password2" minlength="10" required autocomplete="new-password" /></label>
    <div id="spMsg"></div>
    <button class="btn blue" type="submit" style="margin-top:10px">Opslaan en inloggen</button>
  </form>
</section>

<!-- APP -->
<section id="vApp" class="hidden">
  <header class="top">
    <span class="tgl-logo"><span class="tgl-badge">THHEU</span><span class="tgl-word"><span class="tgl-main">THH <span class="tgl-accent">EUROPE</span></span><span class="tgl-sub">Wholesale Supplements</span></span></span>
    <span class="sect">Beheer</span>
    <span class="env hidden" id="envTag">TESTOMGEVING</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button id="btnLogout">Uitloggen</button>
  </header>
  <div class="wrap">
    <nav class="side" id="nav">
      <a href="#dashboard" data-v="dashboard">Overzicht</a>
      <a href="#klanten" data-v="klanten">Klanten <span class="cnt hidden" id="cntPending"></span></a>
      <a href="#orders" data-v="orders">Bestellingen <span class="cnt hidden" id="cntUnshipped"></span></a>
      <a href="#facturen" data-v="facturen">Facturen <span class="cnt hidden" id="cntLate"></span></a>
      <a href="#prijzen" data-v="prijzen">Prijzen</a>
      <a href="#campagnes" data-v="campagnes">Campagnes</a>
      <a href="#aanvragen" data-v="aanvragen">Aanvragen <span class="cnt hidden" id="cntReq"></span></a>
      <a href="#instellingen" data-v="instellingen">Instellingen</a>
      <a href="#log" data-v="log">Logboek</a>
    </nav>
    <main id="main"></main>
  </div>
</section>

<script>
(function(){
"use strict";
var API = "https://thehealthhouse.nl/wp-json/thhe/v1/";
var TK = "thheAdminToken", AK = "thheAdminAccount";
var S = { acc:null, stats:null, dashYear:0, inv:{state:"", year:"", q:"", contact:"", contactName:""}, orders:{status:"open", test:0, page:1}, prices:{q:"", flag:"", brand:"", page:1, rows:[], dirty:{}}, accounts:{status:"", q:""} };
var IS_TEST = !/^(www\.)?thheurope\.com$/.test(location.hostname);

/* ---------- helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function eur(n){ if(n === null || n === undefined || n === "" || isNaN(n)) return "—"; var v = Number(n), s = Math.abs(v).toFixed(2).split("."); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, "."); return (v < 0 ? "- " : "") + "\u20ac " + s[0] + "," + s[1]; }
function num(n, d){ if(n === null || n === undefined || n === "") return ""; return Number(n).toFixed(d === undefined ? 2 : d).replace(".", ","); }

/* ---------- views ---------- */
function show(which){
  $("#vLogin").classList.toggle("hidden", which !== "login");
  $("#vSetpass").classList.toggle("hidden", which !== "setpass");
  $("#vApp").classList.toggle("hidden", which !== "app");

/* ---------- login ---------- */
$("#fLogin").addEventListener("submit", function(e){
  e.preventDefault();
  var f = e.target, btn = f.querySelector("button[type=submit]"), box = $("#loginMsg");
  msg(box); busy(btn, true);
  api("login", { email:f.email.value.trim(), password:f.password.value, remember:f.remember.checked ? 1 : 0, admin:1 }).then(function(res){
    busy(btn, false);
    if(!res.ok || !res.data.token){ msg(box, "bad", res.status === 429 ? "Te veel pogingen. Probeer het over 15 minuten opnieuw." : "E-mail of wachtwoord onjuist."); return; }
    if(!res.data.account || res.data.account.role !== "admin"){ msg(box, "bad", "Dit account heeft geen beheerrechten."); return; }
    setSess(res.data.token, res.data.account, f.remember.checked);
    f.password.value = "";
    start();
  });
});
$("#lnkForgot").addEventListener("click", function(e){
  e.preventDefault();
  var em = $("#fLogin").email.value.trim() || prompt("E-mailadres van het beheeraccount:");
  if(!em) return;
  api("password/forgot", { email:em }).then(function(){ msg($("#loginMsg"), "info", "Als dit adres bestaat, is er een herstellink gemaild. Die is 2 uur geldig."); });
});

$("#fSetpass").addEventListener("submit", function(e){
  e.preventDefault();
  var f = e.target, p = hashParams(), btn = f.querySelector("button"), box = $("#spMsg");
  if(f.password.value !== f.password2.value){ msg(box, "bad", "De wachtwoorden zijn niet gelijk."); return; }
  busy(btn, true);
  api("password/set", { email:p.e, token:p.token, password:f.password.value }).then(function(res){
    busy(btn, false);
    if(!res.ok){ msg(box, "bad", res.data.error === "invalid_link" ? "Deze link is ongeldig of verlopen. Vraag een nieuwe aan." : errMsg(res)); return; }
    if(!res.data.account || res.data.account.role !== "admin"){ msg(box, "ok", "Wachtwoord opgeslagen. Dit is geen beheeraccount; log in via de website."); return; }
    setSess(res.data.token, res.data.account, false);

    start();
  });
});
$("#btnLogout").addEventListener("click", function(){ clearSess(); location.hash = ""; show("login"); });

function route(){
  var h = location.hash.replace(/^#/, "");
  if(h.indexOf("wachtwoord") === 0){ var p = hashParams(); $("#spEmail").textContent = p.e || ""; show("setpass"); return; }
  if(!token()){ show("login"); return; }
  show("app");
  var parts = h.split("?")[0].split("/"), v = parts[0] || "dashboard", id = parts[1];
  $$("#nav a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-v") === v || (v === "klant" && a.getAttribute("data-v") === "klanten") || (v === "order" && a.getAttribute("data-v") === "orders") || (v === "mbklanten" && a.getAttribute("data-v") === "facturen") || (v === "campagne" && a.getAttribute("data-v") === "campagnes")); });
  var m = $("#main"); m.innerHTML = '<p class="muted"><span class="spin"></span> Laden…</p>';

var INV_ST = { draft:["Concept","grey"], open:["Openstaand","info"], pending_payment:["Wacht op betaling","info"], late:["Vervallen","bad"], reminded:["Herinnerd","bad"], paid:["Betaald","ok"], uncollectible:["Oninbaar","grey"], scheduled:["Ingepland","grey"] };
function vInvoices(m){
  var st = S.inv;
  var tabs = [["","Alle"],["unpaid","Openstaand"],["late","Vervallen"],["paid","Betaald"],["credit","Creditfacturen"],["draft","Concepten"]];
  m.innerHTML = '<div class="row"><h1 style="margin:0">Facturen</h1><span class="sp"></span><a class="btn sec" href="#mbklanten">Klanten koppelen</a><button class="btn sec" id="iCsv">CSV</button><button class="btn blue" id="iSync">Nu ophalen uit Moneybird</button></div>' +
    '<div class="small muted" id="iLast" style="margin-top:6px"></div><div id="iMsg"></div><div class="stats4" id="iStats"></div>' +
    '<div class="row" style="margin:4px 0 10px"><div class="tabs" id="iTabs" style="margin:0">' + tabs.map(function(t){ return '<button data-s="' + t[0] + '" class="' + (st.state === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><span class="sp"></span><span id="iChip"></span><select id="iYear"><option value="">Alle jaren</option></select><input type="search" id="iQ" placeholder="Zoek nummer, klant, kenmerk…" value="' + esc(st.q) + '" style="width:240px" /></div><div id="iList"><p class="muted"><span class="spin"></span></p></div>';
  var last = [];
  function chip(){ $("#iChip").innerHTML = st.contact ? '<span class="chipf">' + esc(st.contactName || ("Contact " + st.contact)) + ' <button id="iChipX" title="Filter wissen">×</button></span>' : ""; var x = $("#iChipX"); if(x) x.onclick = function(){ st.contact = ""; st.contactName = ""; chip(); load(); }; }
  function load(){
    var l = $("#iList"); l.innerHTML = '<p class="muted"><span class="spin"></span></p>';
    api("admin/invoices", { state:st.state, year:st.year, q:st.q, contact:st.contact }).then(function(res){
      if(!$("#iList")) return;
      if(!res.ok){ msg(l, "bad", errMsg(res)); return; }
      var d = res.data, T = d.totals || {}, list = d.invoices || []; last = list;
      if(!d.token) msg($("#iMsg"), "warn", "Moneybird is niet gekoppeld (Instellingen → Koppelingen).");
      var ls = d.last && d.last.at ? "Laatst opgehaald uit Moneybird: " + dt(d.last.at) + (d.last.count !== undefined ? " · " + d.last.count + " facturen" : "") + " · wordt elk halfuur automatisch bijgewerkt" : "Nog niet opgehaald.";
      $("#iLast").textContent = ls;
      $("#iStats").innerHTML = (T.demo_n ? '<div class="card stat"><div class="k">Facturen (excl. concepten)</div><div class="v">' + esc((T.count || 0) + " · " + eur(T.total)) + '</div><div class="s"><span class="dd" style="margin:0 5px 0 0"></span>+ ' + T.demo_n + " illustratief · " + esc(eur(T.demo_total)) + "</div></div>" : stat("Facturen (excl. concepten)", (T.count || 0) + " · " + eur(T.total))) + stat("Openstaand", eur(T.open) + " · " + (T.open_n || 0) + " st.", T.open_n) + stat("Vervallen", eur(T.late) + " · " + (T.late_n || 0) + " st.", T.late_n) + stat("Concepten in Moneybird", T.drafts || 0);
      var ys = $("#iYear"); if(ys && ys.options.length <= 1){ (d.years || []).forEach(function(y){ var o = document.createElement("option"); o.value = y; o.textContent = y; if(String(st.year) === String(y)) o.selected = true; ys.appendChild(o); }); }
      var cnt = $("#cntLate"); if(cnt){ cnt.textContent = T.late_n || ""; cnt.classList.toggle("hidden", !T.late_n); }
      if(!list.length){ l.innerHTML = '<p class="muted">Geen facturen in deze selectie.</p>'; return; }
      var sumT = 0, sumU = 0; list.forEach(function(i){ sumT += Number(i.total) || 0; if(["open","late","reminded","pending_payment"].indexOf(i.state) >= 0) sumU += Number(i.unpaid) || 0; });
      l.innerHTML = '<table><thead><tr><th>Factuur</th><th>Datum</th><th>Vervalt</th><th>Klant</th><th>Kenmerk / order</th><th class="num">Excl. btw</th><th class="num">Totaal</th><th class="num">Openstaand</th><th>Status</th></tr></thead><tbody>' +
        list.map(function(i){
          var late = i.state === "late" || i.state === "reminded", unpaid = ["open","late","reminded","pending_payment"].indexOf(i.state) >= 0;
          var acc = i.account ? ' <a class="b info" href="#klant/' + i.account.id + '" title="Portaalaccount">portaal</a>' : "";
          return '<tr class="click' + (late ? " late" : "") + '" data-inv="' + esc(i.id) + '"><td style="white-space:nowrap"><b>' + esc(i.no || "(concept)") + "</b>" + dd(i.demo) + (i.credit ? ' <span class="b info">credit</span>' : "") + "</td><td>" + esc(dt(i.date)) + '</td><td class="small">' + esc(dt(i.due)) + "</td><td>" + esc(i.company) + acc + (i.country && i.country !== "NL" ? ' <span class="muted small">' + esc(i.country) + "</span>" : "") + '</td><td class="small">' + esc(i.order || i.reference || "") + '</td><td class="num">' + eur(i.excl) + '</td><td class="num"><b>' + eur(i.total) + '</b></td><td class="num">' + (unpaid && Number(i.unpaid) ? eur(i.unpaid) : '<span class="muted">—</span>') + "</td><td>" + badge(INV_ST, i.state) + "</td></tr>";
        }).join("") + '</tbody><tfoot><tr><td colspan="6" class="small muted">' + list.length + ' factu(u)r(en) in deze selectie</td><td class="num"><b>' + eur(sumT) + '</b></td><td class="num"><b>' + eur(sumU) + '</b></td><td></td></tr></tfoot></table><p class="small muted">Klik op een factuur om hem in THH Europe-huisstijl te openen; daar kun je hem afdrukken of als PDF opslaan.' + (list.some(function(i){ return i.demo; }) ? ' <span class="dd" style="margin:0 5px 0 8px"></span>Rood rondje = illustratief, geen echte factuur (niet in Moneybird, niet zichtbaar voor klanten, niet in de CSV).' : "") + "</p>";
      $$("tr[data-inv]", l).forEach(function(tr){ tr.onclick = function(e){ if(e.target.closest("a")) return; location.href = invHref(tr.getAttribute("data-inv")); }; });
    });
  }
  chip();
  $$("#iTabs button").forEach(function(b){ b.onclick = function(){ st.state = b.getAttribute("data-s"); $$("#iTabs button").forEach(function(x){ x.classList.toggle("on", x === b); }); load(); }; });
  $("#iYear").onchange = function(e){ st.year = e.target.value; load(); };
  var tm; $("#iQ").oninput = function(e){ clearTimeout(tm); tm = setTimeout(function(){ st.q = e.target.value.trim(); load(); }, 300); };
  $("#iSync").onclick = function(){ var b = this; busy(b, true); api("admin/invoices/sync", {}).then(function(res){ busy(b, false); if(!res.ok){ msg($("#iMsg"), "bad", errMsg(res)); return; } toast("Opgehaald: " + (res.data.count || 0) + " facturen" + (res.data.linked ? ", " + res.data.linked + " gekoppeld" : "")); load(); }); };
  $("#iCsv").onclick = function(){
    var q = function(v){ v = String(v === null || v === undefined ? "" : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var n = function(v){ return v === null || v === undefined || v === "" ? "" : Number(v).toFixed(2).replace(".", ","); };
    var echt = last.filter(function(i){ return !i.demo; }); if(echt.length < last.length) toast("Illustratieve facturen zijn niet meegenomen in de CSV");
    var rows = [["Factuur","Datum","Vervaldatum","Klant","Land","Kenmerk","Order","Excl. btw","Totaal","Openstaand","Status","Credit","Betaald op"]].concat(echt.map(function(i){ return [i.no, i.date, i.due, i.company, i.country, i.reference, i.order, n(i.excl), n(i.total), n(i.unpaid), (INV_ST[i.state] || [i.state])[0], i.credit ? "ja" : "", i.paid_at]; }));
    download("thh-europe-facturen-" + new Date().toISOString().slice(0, 10) + ".csv", "\ufeff" + rows.map(function(r){ return r.map(q).join(";"); }).join("\n"));
  };
  load();
}

    if(!r[0].ok){ msg(l, "bad", errMsg(r[0])); return; }
    var cs = r[0].data.contacts || [];

    var nLinked = cs.filter(function(c){ return c.account; }).length;
    l.innerHTML = '<p class="small"><b>' + cs.length + "</b> Moneybird-klanten met facturen · <b>" + nLinked + "</b> gekoppeld aan een portaalaccount</p>" +
      '<table><thead><tr><th>Klant (Moneybird)</th><th>E-mail</th><th>Land</th><th class="num">Facturen</th><th class="num">Totaal</th><th class="num">Openstaand</th><th>Laatste</th><th>Portaalaccount</th></tr></thead><tbody>' +
      cs.map(function(c){
        var cell;
        if(c.account) cell = '<a href="#klant/' + c.account.id + '">' + esc(c.account.company || c.account.email) + "</a> " + badge(ACC_ST, c.account.status) + (c.account.has_password ? "" : ' <span class="b warn">geen wachtwoord</span>') + ' <button class="btn sec sm" data-unlink="' + c.account.id + '">Ontkoppelen</button>';
        else {
          cell = "";
          if(c.suggest) cell += '<button class="btn ok sm" data-link="' + c.suggest.id + '" data-c="' + esc(c.contact_id) + '">Koppel aan ' + esc(c.suggest.company || c.suggest.email) + "</button> ";
          cell += '<select class="sm" data-sel="' + esc(c.contact_id) + '">' + opts + "</select> ";
          cell += c.has_email ? '<button class="btn sec sm" data-new="' + esc(c.contact_id) + '">Account aanmaken</button>' : '<span class="muted small">geen e-mail in Moneybird</span>';
        }
        return '<tr><td><a href="#facturen" data-mbc="' + esc(c.contact_id) + '" data-mbn="' + esc(c.company) + '"><b>' + esc(c.company || "(zonder naam)") + "</b></a>" + (c.vat ? '<div class="small muted mono">' + esc(c.vat) + "</div>" : "") + '</td><td class="small">' + esc(String(c.emails || "").replace(/,/g, ", ")) + "</td><td>" + esc(c.country) + '</td><td class="num">' + c.n + '</td><td class="num">' + eur(c.total) + '</td><td class="num">' + (Number(c.open) ? eur(c.open) + (c.late ? ' <span class="b bad">' + c.late + " vervallen</span>" : "") : '<span class="muted">—</span>') + '</td><td class="small">' + esc(dt(c.last)) + '</td><td class="small">' + cell + "</td></tr>";
      }).join("") + "</tbody></table>";
    function done(res, okText){ if(!res.ok){ msg($("#cMsg"), "bad", errMsg(res)); window.scrollTo(0, 0); return; } toast(okText); route(); }
    $$("[data-mbc]", l).forEach(function(x){ x.onclick = function(){ S.inv.contact = x.getAttribute("data-mbc"); S.inv.contactName = x.getAttribute("data-mbn"); S.inv.state = ""; }; });
    $$("[data-link]", l).forEach(function(b){ b.onclick = function(){ busy(b, true); api("admin/invoices/link", { account:+b.getAttribute("data-link"), contact_id:b.getAttribute("data-c") }).then(function(res){ busy(b, false); done(res, "Gekoppeld"); }); }; });
    $$("[data-sel]", l).forEach(function(s){ s.onchange = function(){ if(!s.value) return; var cid = s.getAttribute("data-sel"); var txt = s.options[s.selectedIndex].text; if(!confirm("Account " + txt + " koppelen aan dit Moneybird-contact? De klant ziet daarna alle facturen van dit contact.")){ s.value = ""; return; } api("admin/invoices/link", { account:+s.value, contact_id:cid }).then(function(res){ done(res, "Gekoppeld"); }); }; });
    $$("[data-unlink]", l).forEach(function(b){ b.onclick = function(){ if(!confirm("Koppeling verwijderen? De klant ziet deze facturen dan niet meer.")) return; busy(b, true); api("admin/invoices/link", { account:+b.getAttribute("data-unlink"), contact_id:"" }).then(function(res){ busy(b, false); done(res, "Ontkoppeld"); }); }; });
    $$("[data-new]", l).forEach(function(b){ b.onclick = function(){ if(!confirm("Portaalaccount aanmaken voor deze Moneybird-klant? Status wordt Actief, er gaat GEEN mail uit; uitnodigen doe je daarna zelf.")) return; busy(b, true); api("admin/invoices/contact-account", { contact_id:b.getAttribute("data-new") }).then(function(res){ busy(b, false); if(!res.ok){ msg($("#cMsg"), "bad", errMsg(res)); window.scrollTo(0, 0); return; } toast(res.data.linked_existing ? "Bestaand account gekoppeld" : "Account aangemaakt (niet uitgenodigd)"); location.hash = "#klant/" + res.data.account.id; }); }; });
  });

function CS(){ if(!S.camp) S.camp = { tab:"list", cat:null, stock:null }; return S.camp; }

function campCatalog(){
  if(CS().cat) return Promise.resolve(CS().cat);
  return fetch("catalogus-mail.json", { cache:"no-cache" }).then(function(r){ return r.json(); }).then(function(c){ CS().cat = c; return c; }).catch(function(){ CS().cat = []; return []; });
}
function campStock(){
  if(CS().stock) return Promise.resolve(CS().stock);
  return api("admin/camp/stock").then(function(res){ var o = {}; ((res.data && res.data.in_stock) || []).forEach(function(i){ o[i] = 1; }); CS().stock = o; return o; });
}
function pct(a, b){ return b ? Math.round(a / b * 100) + "%" : "—"; }

function campUnsubs(el){
  function draw(list){
    el.innerHTML = '<div class="card" style="margin-bottom:12px"><div class="row"><input type="email" id="uEm" placeholder="e-mailadres" style="min-width:260px"><button class="btn sec" id="uAdd">Handmatig afmelden</button></div><p class="small muted" style="margin:8px 0 0">Afgemelde adressen krijgen nooit meer een campagne. Orderbevestigingen, Track &amp; Trace en facturen blijven gewoon komen.</p></div>' +
      (list.length ? '<table><thead><tr><th>E-mail</th><th>Sinds</th><th>Hoe</th><th></th></tr></thead><tbody>' + list.map(function(u){ return "<tr><td>" + esc(u.email) + '</td><td class="small">' + esc(dt(u.at)) + '</td><td class="small">' + esc(u.source) + (+u.campaign_id ? " · campagne " + u.campaign_id : "") + '</td><td class="num"><button class="btn sec sm" data-rm="' + esc(u.email) + '">Weer aanmelden</button></td></tr>'; }).join("") + "</tbody></table>" : '<p class="muted">Nog niemand afgemeld.</p>');
    $("#uAdd").onclick = function(){ var e = $("#uEm").value.trim(); if(!e) return; api("admin/camp/unsubs", { action:"add", email:e }).then(function(r){ if(!r.ok){ toast(errMsg(r)); return; } toast("Afgemeld"); draw(r.data.list || []); }); };
    $$("button[data-rm]", el).forEach(function(b){ b.onclick = function(){ if(!confirm("Weer aanmelden? Doe dit alleen als de klant daar zelf om vraagt.")) return; api("admin/camp/unsubs", { action:"remove", email:b.getAttribute("data-rm") }).then(function(r){ toast(r.ok ? "Weer aangemeld" : errMsg(r)); if(r.ok) draw(r.data.list || []); }); }; });
  }
  api("admin/camp/unsubs", { action:"list" }).then(function(r){ draw((r.data && r.data.list) || []); });
}

function vCamp(m, id){
  var isNew = !id || id === "nieuw";
  var P = isNew ? Promise.resolve({ ok:true, data:{ campaign:null } }) : api("admin/camp/get", { id:+id });
  Promise.all([P, campCatalog(), campStock()]).then(function(r){
    var res = r[0], CAT = r[1], STK = r[2];
    if(!res.ok){ m.innerHTML = '<div class="msg bad">' + esc(errMsg(res)) + "</div>"; return; }
    var c = res.data.campaign, sendOn = !!res.data.send_enabled;
    var st = {
      id: c ? c.id : 0, name: c ? c.name : "", lang: c ? c.lang : "nl", subject: c ? c.subject : "", status: c ? c.status : "draft",
      data: c ? c.data : { preheader:"", eyebrow:"", title:"", intro:"", section:"", cta_title:"", cta_text:"", show_price:0, products:[], audience:{ src:["accounts","moneybird"], countries:[], exclude:[] }, utm:"" }
    };
    if(isNew){ var D0 = CAMP_DEF.nl; st.subject = D0.subject; st.data.preheader = D0.preheader; st.data.title = D0.title; st.data.intro = D0.intro; st.data.audience.countries = ["NL","BE"]; }
    var ro = st.status !== "draft";
    var dirty = false;

    m.innerHTML = '<a class="back" href="#campagnes">&larr; Campagnes</a>' +
      '<div class="row" style="margin:6px 0 14px"><h1 style="margin:0">' + (isNew ? "Nieuwe campagne" : esc(st.name)) + "</h1>" + badge(CAMP_ST, st.status) + '<span class="sp"></span>' +
      (ro ? '<button class="btn sec" id="cCopy">Kopie maken</button>' : '<button class="btn sec" id="cSave">Opslaan</button>' + (st.id ? '<button class="btn sec" id="cCopy">Kopie</button><button class="btn sec" id="cDel">Verwijderen</button>' : "")) + "</div>" +
      '<div id="cMsg"></div>' +
      '<div class="camp-grid"><div class="camp-form">' +
        (ro ? '<div class="card" id="cStats"></div>' : "") +
        '<div class="card"><div class="grid g2">' +
          '<label class="f">Naam (intern)<input id="fName" value="' + esc(st.name) + '" placeholder="bv. Topsellers oktober NL"></label>' +
          '<label class="f">Taal van de mail<select id="fLang">' + Object.keys(CAMP_LANGS).map(function(k){ return '<option value="' + k + '"' + (st.lang === k ? " selected" : "") + ">" + CAMP_LANGS[k] + "</option>"; }).join("") + "</select></label></div>" +
          '<label class="f">Onderwerp<input id="fSubject" value="' + esc(st.subject) + '" maxlength="120"></label>' +
          '<label class="f">Voorvertoningstekst (preheader)<input id="fPre" value="' + esc(st.data.preheader) + '" maxlength="200"></label>' +
          '<div class="row" style="margin:-4px 0 6px"><button class="btn sec sm" id="fDef">Standaardtekst in deze taal</button><span class="small muted">vult onderwerp, titel en intro opnieuw in</span></div>' +
        "</div>" +
        '<div class="card"><h3 class="ch">Kop</h3>' +
          '<label class="f">Bovenregel (leeg = standaard)<input id="fEyebrow" value="' + esc(st.data.eyebrow) + '" maxlength="80" placeholder="B2B Groothandel Sportvoeding"></label>' +
          '<label class="f">Titel<input id="fTitle" value="' + esc(st.data.title) + '" maxlength="120"></label>' +
          '<label class="f">Intro<textarea id="fIntro" rows="4" maxlength="700">' + esc(st.data.intro) + "</textarea></label>" +
        "</div>" +
        '<div class="card"><div class="row"><h3 class="ch" style="margin:0">Producten <span class="muted small" id="pCount"></span></h3><span class="sp"></span><label class="chk" style="margin:0"><input type="checkbox" id="fPrice"' + (st.data.show_price ? " checked" : "") + "> Toon vanafprijs excl. btw</label></div>" +
          '<p class="small muted" style="margin:6px 0 10px">Kies 4, 6 of 8 producten (twee per rij). Elke tegel krijgt de knop <b>Get a quote</b> naar het product op thheurope.com.</p>' +
          '<div id="pSel" class="psel"></div>' +
          (ro ? "" : '<div class="row" style="margin-top:10px"><input type="search" id="pQ" placeholder="Zoek op merk of product…" style="flex:1;min-width:200px"><label class="chk" style="margin:0"><input type="checkbox" id="pStock" checked> alleen op voorraad</label></div><div id="pRes" class="pres"></div>') +
        "</div>" +
        '<div class="card"><h3 class="ch">Afsluiter (leeg = standaard)</h3>' +
          '<label class="f">Titel<input id="fCtaT" value="' + esc(st.data.cta_title) + '" maxlength="100" placeholder="Klaar om in te kopen?"></label>' +
          '<label class="f">Tekst<input id="fCtaX" value="' + esc(st.data.cta_text) + '" maxlength="300" placeholder="Stel uw offertelijst samen…"></label>' +
          '<label class="f">Sectietitel producten<input id="fSection" value="' + esc(st.data.section) + '" maxlength="80" placeholder="Uitgelichte producten"></label>' +
        "</div>" +
        '<div class="card"><h3 class="ch">Doelgroep</h3>' +
          '<label class="chk"><input type="checkbox" id="aAcc"' + (st.data.audience.src.indexOf("accounts") >= 0 ? " checked" : "") + "> Goedgekeurde portaalklanten</label>" +
          '<label class="chk"><input type="checkbox" id="aMb"' + (st.data.audience.src.indexOf("moneybird") >= 0 ? " checked" : "") + "> Bestaande klanten uit Moneybird (met e-mailadres)</label>" +
          '<label class="f" style="margin-top:10px">Landen (leeg = alle)<input id="aCc" value="' + esc(st.data.audience.countries.join(", ")) + '" placeholder="bv. NL, BE"></label>' +
          '<div class="row" style="margin:-4px 0 10px"><button class="btn sec sm" data-cc="">Alle landen</button><button class="btn sec sm" data-cc="NL,BE">NL + BE</button><button class="btn sec sm" data-cc="DE,AT">DE + AT</button><button class="btn sec sm" data-cc="!NL,BE">Buitenland (niet NL/BE)</button></div>' +
          '<div class="row"><button class="btn sec" id="aShow">Bekijk ontvangers</button><span id="aCount" class="small muted"></span></div><div id="aList"></div>' +
          '<p class="small muted" style="margin:10px 0 0">Nooit mee: testaccounts, beheerders, eigen bedrijven (THH, Team Champ, Fenix, Prive All), @thehealthhouse.nl/@thheurope.com/@teamchamp.nl en afgemelde adressen.</p>' +
        "</div>" +
        '<div class="card"><h3 class="ch">Test en verzenden</h3>' +
          '<div class="row"><input type="email" id="tTo" placeholder="leeg = vast testadres (Gmail Ismail)" value="" style="min-width:260px"><button class="btn sec" id="tSend">Testmail sturen</button></div>' +
          '<p class="small muted" style="margin:6px 0 12px">Een testmail heeft een rode balk "TESTMAIL" en telt niet mee in de statistieken.</p>' +
          (ro ? "" : '<button class="btn" id="cSend"' + (sendOn ? "" : " disabled") + ">Verzenden naar doelgroep</button>" + (sendOn ? "" : ' <span class="small muted">Vergrendeld tot akkoord van Ismail.</span>')) +
          '<div id="sProg"></div>' +
        "</div>" +
      '</div><div class="camp-prev"><div class="card" style="padding:12px"><div class="row" style="margin-bottom:8px"><span class="small muted">Onderwerp:</span> <b id="pvSubj" class="small"></b><span class="sp"></span><div class="tabs" style="margin:0"><button data-w="640" class="on">Desktop</button><button data-w="390">Mobiel</button></div><button class="btn sec sm" id="pvRef">Ververs</button></div>' +
        '<div class="pv-wrap"><iframe id="pv" title="Voorbeeld" style="width:640px"></iframe></div></div></div></div>';

    function collect(){
      if(ro) return;
      st.name = $("#fName").value.trim(); st.lang = $("#fLang").value; st.subject = $("#fSubject").value.trim();
      var d = st.data;
      d.preheader = $("#fPre").value.trim(); d.eyebrow = $("#fEyebrow").value.trim(); d.title = $("#fTitle").value.trim(); d.intro = $("#fIntro").value.trim();
      d.cta_title = $("#fCtaT").value.trim(); d.cta_text = $("#fCtaX").value.trim(); d.section = $("#fSection").value.trim(); d.show_price = $("#fPrice").checked ? 1 : 0;
      d.audience.src = []; if($("#aAcc").checked) d.audience.src.push("accounts"); if($("#aMb").checked) d.audience.src.push("moneybird");
      d.audience.countries = $("#aCc").value.toUpperCase().split(/[^A-Z]+/).filter(function(x){ return x.length === 2; });
    }
    function payload(){ collect(); return { id:st.id, draft:{ name:st.name, lang:st.lang, subject:st.subject, data:st.data } }; }
    var pvT;
    function preview(){
      clearTimeout(pvT);
      pvT = setTimeout(function(){
        $("#pvSubj").textContent = st.subject || "—";
        api("admin/camp/preview", ro ? { id:st.id } : payload()).then(function(r){ if(r.ok && $("#pv")) $("#pv").srcdoc = r.data.html; });
      }, 500);
    }
    function drawSel(){
      var el = $("#pSel"), P = st.data.products;
      $("#pCount").textContent = "(" + P.length + ")";
      el.innerHTML = P.length ? P.map(function(p, i){
        return '<div class="pitem"><img src="' + esc(campImg(p.img)) + '" alt=""><div class="pt"><div class="small muted">' + esc(p.brand) + "</div><div>" + esc(p.name) + "</div>" + (STK[p.id] ? '<span class="b ok">op voorraad</span>' : '<span class="b grey">niet op voorraad</span>') + "</div>" +
          (ro ? "" : '<div class="pb"><button class="btn sec sm" data-up="' + i + '" title="Omhoog">&uarr;</button><button class="btn sec sm" data-dn="' + i + '" title="Omlaag">&darr;</button><button class="btn sec sm" data-rm="' + i + '" title="Verwijderen">&times;</button></div>') + "</div>";
      }).join("") : '<p class="muted small">Nog geen producten gekozen.</p>';
      if(P.length % 2) el.insertAdjacentHTML("beforeend", '<p class="small" style="color:#e0a800">Oneven aantal: de laatste rij heeft één tegel.</p>');
      $$("button[data-up]", el).forEach(function(b){ b.onclick = function(){ var i = +b.getAttribute("data-up"); if(i > 0){ var t = P[i - 1]; P[i - 1] = P[i]; P[i] = t; changed(); drawSel(); } }; });
      $$("button[data-dn]", el).forEach(function(b){ b.onclick = function(){ var i = +b.getAttribute("data-dn"); if(i < P.length - 1){ var t = P[i + 1]; P[i + 1] = P[i]; P[i] = t; changed(); drawSel(); } }; });
      $$("button[data-rm]", el).forEach(function(b){ b.onclick = function(){ P.splice(+b.getAttribute("data-rm"), 1); changed(); drawSel(); }; });
    }
    function search(){
      var q = $("#pQ").value.trim().toLowerCase(), onlyStock = $("#pStock").checked, el = $("#pRes");
      if(q.length < 2){ el.innerHTML = ""; return; }
      var words = q.split(/\s+/), have = {}; st.data.products.forEach(function(p){ have[p.id] = 1; });
      var hits = CAT.filter(function(p){ var t = (p.brand + " " + p.name + " " + (p.cat || "")).toLowerCase(); return words.every(function(w){ return t.indexOf(w) >= 0; }) && (!onlyStock || STK[p.id]); }).slice(0, 30);
      el.innerHTML = hits.length ? hits.map(function(p){ return '<button class="pr" data-add="' + p.id + '"' + (have[p.id] ? " disabled" : "") + '><img src="' + esc(campImg(p.img)) + '" alt=""><span><span class="small muted">' + esc(p.brand) + "</span><br>" + esc(p.name) + (p.unit ? ' <span class="muted small">' + esc(p.unit) + "</span>" : "") + "</span>" + (STK[p.id] ? "" : '<span class="b grey">uit</span>') + "</button>"; }).join("") : '<p class="small muted">Niets gevonden.</p>';
      $$("button[data-add]", el).forEach(function(b){ b.onclick = function(){
        if(st.data.products.length >= 12){ toast("Maximaal 12 producten"); return; }
        var p = CAT.find(function(x){ return String(x.id) === b.getAttribute("data-add"); }); if(!p) return;
        st.data.products.push({ id:p.id, slug:p.slug, brand:p.brand, name:p.name, unit:p.unit || "", img:p.img }); b.disabled = true; changed(); drawSel();
      }; });
    }
    function changed(){ dirty = true; preview(); }
    function save(){
      collect();
      if(!st.subject){ msg($("#cMsg"), "bad", "Vul een onderwerp in."); return Promise.resolve(false); }
      var btn = $("#cSave"); busy(btn, true);
      return api("admin/camp/save", { id:st.id, name:st.name, lang:st.lang, subject:st.subject, data:st.data }).then(function(r){
        busy(btn, false);
        if(!r.ok){ msg($("#cMsg"), "bad", errMsg(r)); return false; }
        dirty = false; toast("Opgeslagen");
        if(!st.id){ st.id = r.data.id; history.replaceState(null, "", "#campagne/" + st.id); }
        return true;
      });
    }
    function audience(){
      collect();
      var el = $("#aList"); $("#aCount").innerHTML = '<span class="spin"></span>';
      api("admin/camp/audience", { audience:st.data.audience }).then(function(r){
        if(!r.ok){ $("#aCount").textContent = errMsg(r); return; }
        var d = r.data, sk = d.skipped || {};
        $("#aCount").innerHTML = "<b>" + d.count + " ontvangers</b> · " + Object.keys(d.by_country || {}).map(function(k){ return k + " " + d.by_country[k]; }).join(", ") + (sk.unsub ? " · " + sk.unsub + " afgemeld" : "") + (sk.intern ? " · " + sk.intern + " intern overgeslagen" : "");
        el.innerHTML = d.list.length ? '<div class="tscroll" style="max-height:260px;overflow:auto;margin-top:8px"><table><thead><tr><th>Bedrijf</th><th>E-mail</th><th>Land</th><th>Bron</th></tr></thead><tbody>' + d.list.map(function(x){ return "<tr><td>" + esc(x.company || x.name || "—") + '</td><td class="small">' + esc(x.email) + "</td><td>" + esc(x.country) + '</td><td class="small muted">' + esc(x.src) + "</td></tr>"; }).join("") + "</tbody></table></div>" : "";
        CS().lastCountries = Object.keys(d.by_country || {});
      });
    }
    function stats(){
      var el = $("#cStats"); if(!el) return;
      api("admin/camp/recipients", { id:st.id }).then(function(r){
        var L = (r.data && r.data.list) || [], s = c.stats || {};
        el.innerHTML = '<h3 class="ch">Resultaat</h3><div class="stats4">' + kpi("Verstuurd", s.sent || 0, s.failed ? s.failed + " mislukt" : "") + kpi("Geopend", s.opened || 0, pct(s.opened, s.sent)) + kpi("Geklikt", s.clicked || 0, pct(s.clicked, s.sent) + " · " + (s.clicks || 0) + " kliks") + kpi("Wachtrij", s.queued || 0, "") + "</div>" +
          (L.length ? '<div class="tscroll" style="max-height:300px;overflow:auto;margin-top:10px"><table><thead><tr><th>Bedrijf</th><th>E-mail</th><th>Status</th><th>Geopend</th><th>Geklikt</th></tr></thead><tbody>' + L.map(function(x){ return "<tr><td>" + esc(x.company || "—") + '</td><td class="small">' + esc(x.email) + '</td><td class="small">' + esc(x.status) + (x.err ? ' <span class="muted">' + esc(x.err) + "</span>" : "") + '</td><td class="small">' + (x.opened_at ? esc(dt(x.opened_at)) + " (" + x.open_n + "×)" : "—") + '</td><td class="small">' + (x.clicked_at ? esc(dt(x.clicked_at)) + " (" + x.click_n + "×)" : "—") + "</td></tr>"; }).join("") + "</tbody></table></div>" : "");
      });
    }

    drawSel(); preview(); if(ro) stats();
    $$(".camp-prev .tabs button").forEach(function(b){ b.onclick = function(){ $$(".camp-prev .tabs button").forEach(function(x){ x.classList.toggle("on", x === b); }); $("#pv").style.width = b.getAttribute("data-w") + "px"; }; });
    $("#pvRef").onclick = preview;
    if(!ro){
      ["fName","fSubject","fPre","fEyebrow","fTitle","fIntro","fCtaT","fCtaX","fSection","aCc"].forEach(function(k){ $("#" + k).addEventListener("input", changed); });
      ["fLang","fPrice","aAcc","aMb"].forEach(function(k){ $("#" + k).addEventListener("change", changed); });
      $("#fDef").onclick = function(){ var D = CAMP_DEF[$("#fLang").value] || CAMP_DEF.en; if(($("#fTitle").value || $("#fIntro").value) && !confirm("Onderwerp, voorvertoning, titel en intro vervangen door de standaardtekst?")) return; $("#fSubject").value = D.subject; $("#fPre").value = D.preheader; $("#fTitle").value = D.title; $("#fIntro").value = D.intro; changed(); };
      var qt; $("#pQ").oninput = function(){ clearTimeout(qt); qt = setTimeout(search, 200); };
      $("#pStock").onchange = search;
      $("#cSave").onclick = save;
      $$("button[data-cc]", m).forEach(function(b){ b.onclick = function(){
        var v = b.getAttribute("data-cc");
        if(v.charAt(0) === "!"){
          var ex = v.slice(1).split(",");
          api("admin/camp/audience", { audience:{ src:st.data.audience.src, countries:[] } }).then(function(r){ var keys = Object.keys((r.data && r.data.by_country) || {}).filter(function(k){ return ex.indexOf(k) < 0 && k !== "??"; }); $("#aCc").value = keys.join(", "); changed(); audience(); });
          return;
        }
        $("#aCc").value = v.split(",").filter(Boolean).join(", "); changed(); audience();
      }; });
      if(st.id){
        $("#cDel").onclick = function(){ if(!confirm("Deze concept-campagne verwijderen?")) return; api("admin/camp/delete", { id:st.id }).then(function(r){ if(!r.ok){ toast(errMsg(r)); return; } toast("Verwijderd"); location.hash = "#campagnes"; }); };
      }
      var sb = $("#cSend");
      if(sb) sb.onclick = function(){
        save().then(function(ok){
          if(!ok) return;
          api("admin/camp/audience", { id:st.id }).then(function(r){
            if(!r.ok){ toast(errMsg(r)); return; }
            var n = r.data.count;
            var w = prompt("Je gaat \"" + st.subject + "\" versturen naar " + n + " zakelijke klanten. Dit kan niet ongedaan worden gemaakt.\n\nTyp VERZENDEN om te bevestigen:");
            if(w !== "VERZENDEN") { toast("Niet verzonden"); return; }
            var pr = $("#sProg"); pr.innerHTML = '<p class="small"><span class="spin"></span> Bezig met verzenden…</p>';
            (function step(first){
              api("admin/camp/send", first ? { id:st.id, confirm:"VERZENDEN" } : { id:st.id }).then(function(x){
                if(!x.ok){ pr.innerHTML = '<div class="msg bad">' + esc(errMsg(x)) + "</div>"; return; }
                var s = x.data.stats || {};
                pr.innerHTML = '<p class="small">' + (s.sent || 0) + " van " + (s.n || 0) + " verstuurd" + (s.failed ? " · " + s.failed + " mislukt" : "") + "</p>";
                if(x.data.status === "sent"){ toast("Campagne verstuurd"); setTimeout(function(){ route(); }, 800); return; }
                setTimeout(function(){ step(false); }, x.data.busy ? 4000 : 600);
              });
            })(true);
          });
        });
      };
    } else {
      // Verstuurde of lopende campagne: alleen bekijken; lopend -> doorgaan.
      if(st.status === "sending" && sendOn){ $("#sProg").innerHTML = '<button class="btn" id="cResume">Verzenden hervatten</button>'; $("#cResume").onclick = function(){ api("admin/camp/send", { id:st.id }).then(function(){ route(); }); }; }
    }
    var cp = $("#cCopy"); if(cp) cp.onclick = function(){ api("admin/camp/copy", { id:st.id }).then(function(r){ if(!r.ok){ toast(errMsg(r)); return; } toast("Kopie gemaakt"); location.hash = "#campagne/" + r.data.id; }); };
    $("#tSend").onclick = function(){
      var to = $("#tTo").value.trim(), b = this;
      if(!st.data.products.length){ toast("Voeg eerst producten toe"); return; }
      busy(b, true);
      api("admin/camp/test", ro ? { id:st.id, to:to } : Object.assign(payload(), { to:to })).then(function(r){ busy(b, false); toast(r.ok ? "Testmail verstuurd naar " + r.data.sent_to : errMsg(r)); });
    };
    window.onbeforeunload = function(){ return dirty && location.hash.indexOf("#campagne/") === 0 ? "Niet opgeslagen wijzigingen" : undefined; };
  });
}
function campImg(src){ src = String(src || ""); return /^https?:/.test(src) ? src : "https://thheurope.com/" + src.replace(/^\//, ""); }

/*@@CAMP_END*/
})();
</script>
</body>
</html>
