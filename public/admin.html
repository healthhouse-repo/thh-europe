<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quote requests | Eleven Fashion</title>
<style>
:root{--ink:#111;--muted:#6b6b6b;--line:#e6e3de;--bg:#faf9f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px}
h1{font-size:22px;margin:0 0 16px}
input{border:1px solid #d8d4cd;border-radius:10px;padding:10px 12px;font:14px inherit}
button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 18px;font-weight:600;cursor:pointer}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.q h2{font-size:16px;margin:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q h2 small{font-weight:400;color:var(--muted)}
.q table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}.q td,.q th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.logos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.logos a{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-decoration:none;color:inherit}
.logos img{width:36px;height:36px;object-fit:contain}
.muted{color:var(--muted)}
.mk{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.mk a{text-decoration:none;color:inherit;text-align:center;font-size:12px}.mk img{width:120px;height:144px;object-fit:contain;background:#f4f4f4;display:block;border:1px solid var(--line)}.dl{font-size:13px;padding-left:6px}
</style></head><body><div class="wrap">
<h1>Quote requests</h1>
<form id="lf"><input type="password" id="pw" placeholder="Password" autocomplete="current-password"> <button>Show</button> <span id="msg" class="muted"></span></form>
<input id="flt" placeholder="Search name, company, e-mail, product…" style="width:100%;margin-top:14px;display:none">
<div id="list"></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var all=[];
document.getElementById('lf').onsubmit=function(e){e.preventDefault();var m=document.getElementById('msg');m.textContent='Loading…';
  fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
    if(!x.ok){m.textContent=x.j.error||'Error';return}
    all=x.j.quotes;m.textContent=x.j.total+' request(s)';document.getElementById('flt').style.display='block';render();});};
document.getElementById('flt').oninput=render;
function render(){var f=document.getElementById('flt').value.toLowerCase();
  document.getElementById('list').innerHTML=all.filter(function(q){return !f||JSON.stringify(q).toLowerCase().indexOf(f)>=0}).map(function(q){var c=q.contact||{};
    var tot=(q.items||[]).reduce(function(a,i){return a+(+i.quantity||0)},0);
    return '<div class="q"><h2><span>'+esc(q.reference)+' · '+esc(c.company||c.name)+'</span><small>'+esc(new Date(q.created_at).toLocaleString())+' · '+tot+' pcs</small></h2>'+
    '<div>'+esc(c.name)+' · <a href="mailto:'+esc(c.email)+'?subject='+encodeURIComponent('Your quote request '+q.reference)+'">'+esc(c.email)+'</a>'+(c.phone?' · '+esc(c.phone):'')+' · '+esc(c.country)+(c.customer_type?' · '+esc(c.customer_type):'')+(c.website_url?' · '+esc(c.website_url):'')+'</div>'+
    '<table><tr><th>Product</th><th>Qty / sizes</th><th>Fabric</th><th>Colours</th><th>Decoration</th><th>Extras / notes</th></tr>'+(q.items||[]).map(function(i){
      var sz=Object.keys(i.sizes||{}).map(function(s){return s+': '+i.sizes[s]}).join(', ');
      return '<tr><td>'+esc(i.product)+(i.product_other?' – '+esc(i.product_other):'')+(i.fit?'<br><span class="muted">'+esc(i.fit)+'</span>':'')+'</td><td>'+esc(i.quantity)+(sz?'<br><span class="muted">'+esc(sz)+'</span>':'')+'</td><td>'+esc([i.weight,i.material].filter(Boolean).join(', '))+'</td><td>'+esc(i.colors.join(', '))+(i.pantone?'<br>'+esc(i.pantone):'')+'</td><td>'+esc(i.decoration.join(', '))+(i.positions.length?'<br><span class="muted">'+esc(i.positions.join(', '))+'</span>':'')+(i.print_colors?'<br>'+esc(i.print_colors)+' colours':'')+'</td><td>'+esc(i.extras.join(', '))+(i.notes?'<br>'+esc(i.notes):'')+(i.more_colors?'<br>More colours: '+esc(i.more_colors):'')+'</td></tr>'+
      (((i.mockups||[]).length||(i.design||[]).length)?'<tr><td colspan="6"><div class="mk">'+(i.mockups||[]).map(function(m){return '<a href="'+esc(m.url)+'" target="_blank" rel="noopener"><img src="'+esc(m.url)+'" alt=""><span>'+esc(m.view)+'</span></a>'}).join('')+
        '<div class="dl">'+(i.design||[]).map(function(d){return '<div>'+esc(d.view)+': '+(d.type==='text'?'text “'+esc(d.text)+'” ('+esc(d.font)+', '+esc(d.color)+')':(d.logo_url?'<a href="'+esc(d.logo_url)+'" target="_blank" rel="noopener">'+esc(d.logo_name||'logo')+'</a>':esc(d.logo_name||'logo')))+'</div>'}).join('')+'</div></div></td></tr>':'')}).join('')+'</table>'+
    ((q.logos||[]).length||q.artwork_link?'<div class="logos">'+(q.logos||[]).map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+(/\.(png|jpe?g|svg|webp)(\?|$)/i.test(l.url)?'<img src="'+esc(l.url)+'" alt="">':'📄')+esc(l.name)+'</a>'}).join('')+(q.artwork_link?'<a href="'+esc(q.artwork_link)+'" target="_blank" rel="noopener">🔗 Artwork link</a>':'')+'</div>':'')+
    '<div class="muted" style="margin-top:8px">'+[q.deadline?'Needed by '+q.deadline:'',q.delivery_country?'Deliver to '+q.delivery_country:'',q.budget?'Budget '+q.budget:''].filter(Boolean).map(esc).join(' · ')+'</div>'+
    (q.message?'<p>'+esc(q.message)+'</p>':'')+'</div>'}).join('')||'<p class="muted">No requests found.</p>';}
</script></body></html>
